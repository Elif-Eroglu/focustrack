services:
  postgres:
    image: postgres:16
    container_name: focustrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: focustrack
      POSTGRES_PASSWORD: focustrack123
      POSTGRES_DB: focustrack
    ports:
      - "5432:5432"
    volumes:
      - focustrack_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: focustrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: focustrack-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: focustrack
      DB_PASSWORD: focustrack123
      DB_NAME: focustrack
      REDIS_URL: redis://redis:6379
      JWT_SECRET: focustrack_super_secret_key
      PORT: 5000
    ports:
      - "5000:5000"

volumes:
  focustrack_pgdata:
